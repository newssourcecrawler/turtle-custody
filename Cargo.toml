[workspace]
resolver = "2"
members = ["turtle/src"]
exclude = ["vendor/nsc_block", "vendor/nsc_frame"]

[workspace.package]
version = "0.0.2-dev.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Turtle Contributors"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.dependencies]
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
loom = "0.7"
blake3 = "1.5"
nsc_block = { path = "vendor/nsc_block" }
nsc_frame = { path = "vendor/nsc_frame" }
